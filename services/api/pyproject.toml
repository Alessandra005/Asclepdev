[project]
name = "asclep-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "pymongo>=4.8",
  "pyyaml>=6.0",  # ontology registry/views/code groups
  "python-multipart>=0.0.9",  # LiveScribing windows are multipart uploads
  "asclep-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
