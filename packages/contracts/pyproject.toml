[project]
name = "asclep-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for every Asclep service (spec sections 9, 10, 7A, 15)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asclep_contracts"]
