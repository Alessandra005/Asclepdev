# One command: `make up` (spec section 5). Ports match the spec's service table.
name: asclep

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: {context: .., dockerfile: services/api/Dockerfile}
    env_file: .env
    environment:
      LABTECH_URL: http://lab-tech:8000
      RESIDENT_URL: http://resident:8000
      EHR_A_URL: http://ehr-a:8080/fhir
      EHR_B_URL: http://ehr-b:8080/fhir
      MONGO_URL: mongodb://mongo:27017
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
    volumes: [../data:/srv/data]

  # LiveScribing store (conversation transcripts, observations, actions, reports). Text only, never media.
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

  lab-tech:
    build: {context: .., dockerfile: services/lab-tech/Dockerfile}
    env_file: .env
    ports: ["8100:8000"]
    volumes: [../data:/srv/data]
    # Uncomment when running CONCH on a GPU host:
    # deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}

  resident:
    build: {context: .., dockerfile: services/resident/Dockerfile}
    env_file: .env
    environment:
      GATEWAY_URL: http://api:8000/api/v1
    ports: ["8200:8000"]
    # Whisper weights download once and are cached here. Reaches a VLM on the host via host.docker.internal.
    volumes: [resident-models:/root/.cache/huggingface]
    extra_hosts: ["host.docker.internal:host-gateway"]

  ehr-a:
    image: hapiproject/hapi:latest
    ports: ["8080:8080"]

  ehr-b:
    image: hapiproject/hapi:latest
    ports: ["8081:8080"]

  # The Scribe's model server (spec 10.5). Local only; request logging OFF. Start with: --profile gpu
  vlm:
    profiles: ["gpu"]
    image: lmsysorg/sglang:latest   # Brandon: swap for whatever the prototype uses (vLLM is fine)
    command: >
      python3 -m sglang.launch_server --model-path Qwen/Qwen3.8-27B-FP8
      --host 0.0.0.0 --port 8000
    ports: ["8300:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN}
    deploy: {resources: {reservations: {devices: [{capabilities: [gpu]}]}}}

volumes:
  pgdata:
  mongodata:
  resident-models:
